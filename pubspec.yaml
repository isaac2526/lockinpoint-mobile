name: lockinpoint
description: "LockInPoint — practise real past questions for JAMB, WAEC, NECO, NABTEB, GCE and Post UTME."
publish_to: "none"

# VERSIONING LAW.
#   1.0.0  · what a human reads, semantic
#   +1     · the build number, MONOTONIC and never reused
#
# The build number is what Google Play and the App Store compare, so it only
# ever goes up. The application identity — com.lockinpoint.app — and the
# signing key are fixed for the life of the product: change either and every
# existing installation loses the ability to update, which is the one mistake
# that cannot be undone from the server side.
version: 1.0.13+14

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # ---- state, routing -----------------------------------------------------
  flutter_riverpod: ^3.0.2
  riverpod_annotation: ^3.0.2
  go_router: ^17.0.0

  # ---- the network --------------------------------------------------------
  dio: ^5.9.0
  connectivity_plus: ^7.0.0

  # ---- identity and secrets ----------------------------------------------
  # Deliberately NO auth SDK: identity is three routes on the one backend
  # (login, refresh, logout), so the app carries no project address that
  # could drift from what the server is configured with.
  flutter_secure_storage: ^9.2.4

  # ---- the offline vault --------------------------------------------------
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.1

  # ---- rendering a question ----------------------------------------------
  # A stem is sanitised HTML with KaTeX inside it on the website. These two
  # together are the mobile half of that pipeline.
  flutter_html: ^3.0.0
  # flutter_html 3.0.0 reaches into html's internals (query_selector.matches),
  # and html 0.15.7 removed that function — the combination fails to compile.
  # Pinned to the last version that still carries it; drop this pin when
  # flutter_html ships a release built against the newer html.
  html: 0.15.6
  flutter_math_fork: ^0.7.4
  cached_network_image: ^3.4.1

  # ---- polish -------------------------------------------------------------
  # NOTE: google_fonts was removed deliberately. It fetched Space Grotesk,
  # Inter and JetBrains Mono over the network on first launch — three round
  # trips before the first word could be painted. The faces now ship as
  # assets below.
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.9.0
  riverpod_generator: ^3.0.2
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.2
  drift_dev: ^2.28.2
  flutter_launcher_icons: ^0.14.4

# The launcher icon is the real crowned mark, rendered from the website's own
# logo geometry. The adaptive foreground keeps the art inside Android's safe
# zone so no mask shape ever clips the cap.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0F2C86"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # THE FACES SHIP WITH THE APP.
  # Bundled rather than fetched, so the first frame draws in the real brand
  # typeface with no network at all. See lib/design/typography.dart.
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
