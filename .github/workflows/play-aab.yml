# =============================================================================
# THE GOOGLE PLAY BUNDLE — and nothing else.
#
# One job, one artifact, one question answered: is this .aab actually signed
# with the upload key and fit to upload?
#
# IT REFUSES TO PRODUCE A DEBUG-SIGNED BUNDLE. The release matrix used to fall
# back to the debug key and warn; a warning on a run summary is exactly the
# kind of thing that gets scrolled past, and the bundle it produced was then
# offered as if it were a release. Worse, GitHub runners generate a FRESH
# RANDOM debug keystore per run, so even a bundle Play somehow accepted could
# never be updated — every later build would carry a different key. This job
# fails instead, and names the missing secrets.
#
# WHAT IT PROVES, rather than asserts:
#   · the signer certificate is read back OUT of the finished .aab, and the
#     build fails if it is the Android Debug certificate
#   · the package name, versionCode and versionName are read back out of the
#     bundle's own manifest with Google's bundletool — not from pubspec.yaml,
#     which is what the build was told, not what it produced
# =============================================================================
name: play-aab

on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write        # to attach the bundle to a Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - run: flutter pub get

      # -----------------------------------------------------------------------
      # THE UPLOAD KEY IS REQUIRED. Not optional, not warned about.
      # -----------------------------------------------------------------------
      - name: Require the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          if [ -z "$KEYSTORE_BASE64" ]; then missing="$missing ANDROID_KEYSTORE_BASE64"; fi
          if [ -z "$STORE_PASSWORD" ];   then missing="$missing ANDROID_KEYSTORE_PASSWORD"; fi
          if [ -z "$KEY_ALIAS" ];        then missing="$missing ANDROID_KEY_ALIAS"; fi
          if [ -z "$KEY_PASSWORD" ];     then missing="$missing ANDROID_KEY_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — refusing to build a debug-signed bundle Google Play would reject."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          # key.properties is git-ignored and exists only on this runner.
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Upload key written for alias $KEY_ALIAS."

      - name: Build the bundle
        run: flutter build appbundle --release

      # -----------------------------------------------------------------------
      # READ THE ANSWER BACK OUT OF THE ARTIFACT.
      # -----------------------------------------------------------------------
      - name: Prove it is release-signed and fit for Play
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB" || { echo "::error::no bundle was produced"; exit 1; }

          echo "### The bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$AAB" | tee -a "$GITHUB_STEP_SUMMARY"

          # --- the signer, read from the finished bundle -------------------
          keytool -printcert -jarfile "$AAB" > signer.txt
          if grep -q "CN=Android Debug" signer.txt; then
            echo "::error::This bundle is signed with the ANDROID DEBUG certificate. Google Play will refuse it."
            cat signer.txt
            exit 1
          fi
          grep -E "Owner:|Valid from:|SHA256:" signer.txt | head -4 | tee -a "$GITHUB_STEP_SUMMARY"

          # --- the manifest, read from the bundle with Google's own tool ----
          BT=1.17.2
          curl -sSL -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/$BT/bundletool-all-$BT.jar"
          java -jar bundletool.jar dump manifest --bundle="$AAB" > manifest.xml

          PKG=$(java -jar bundletool.jar dump manifest --bundle="$AAB" --xpath=/manifest/@package)
          VC=$(java -jar bundletool.jar dump manifest --bundle="$AAB" --xpath=/manifest/@android:versionCode)
          VN=$(java -jar bundletool.jar dump manifest --bundle="$AAB" --xpath=/manifest/@android:versionName)
          echo "package=$PKG versionCode=$VC versionName=$VN" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # The package name can never change once Play has seen it.
          if [ "$PKG" != "com.lockinpoint.app" ]; then
            echo "::error::package is $PKG, expected com.lockinpoint.app"
            exit 1
          fi
          echo "::notice::Release-signed $PKG $VN ($VC) — ready to upload to Google Play."

          # --- the signer must be OUR key, not merely some non-debug key ----
          # Same pinned fingerprint release.yml checks against. A bundle
          # signed by anything else would be refused by Play anyway; better
          # to learn it here than at the upload screen.
          EXPECTED=2953BB83663A352EA750F661001D6893B294B7F98B3881BEA936E282EF542E27
          GOT=$(grep -oiE "([0-9A-F]{2}:){31}[0-9A-F]{2}" signer.txt | head -1 | tr -d ':' | tr 'a-f' 'A-F')
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::Signed with an UNEXPECTED key.%0Aexpected $EXPECTED%0Agot      $GOT"
            exit 1
          fi
          echo "::notice::Signer matches the upload key: SHA-256 $GOT"

          # --- the numbers a truncated download will not match --------------
          BYTES=$(stat -c%s "$AAB")
          SHA=$(sha256sum "$AAB" | cut -d' ' -f1)
          {
            echo ""
            echo "### Verify your download"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| exact size | \`$BYTES\` bytes |"
            echo "| sha256 | \`$SHA\` |"
            echo ""
            echo "If the file on your phone is not EXACTLY $BYTES bytes, the download was cut short — delete it and fetch it again."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::app-release.aab is $BYTES bytes, sha256 $SHA"
          cp "$AAB" "lockinpoint-$VN-$VC.aab"
          echo "ASSET=lockinpoint-$VN-$VC.aab" >> "$GITHUB_ENV"
          echo "BYTES=$BYTES" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "VN=$VN" >> "$GITHUB_ENV"
          echo "VC=$VC" >> "$GITHUB_ENV"

      # -----------------------------------------------------------------------
      # A DIRECT LINK, BECAUSE THE ARTIFACT ZIP IS A TRAP ON A PHONE.
      #
      # Actions artifacts only download wrapped in a .zip, so getting the
      # bundle onto a phone means a 62MB transfer over mobile data and then an
      # extraction in a file manager — two more places for the file to arrive
      # short. A Release asset is the .aab itself: one tap, no unwrapping, and
      # a resumable download. The size and checksum are in the body so a bad
      # copy can be spotted before Play rejects it.
      # -----------------------------------------------------------------------
      - name: Publish the bundle as a Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="aab-$VN-$VC"
          NOTES=$(printf '%s\n' \
            "Google Play upload bundle." \
            "" \
            "- version **$VN ($VC)**" \
            "- package \`com.lockinpoint.app\`" \
            "- size \`$BYTES\` bytes" \
            "- sha256 \`$SHA\`" \
            "" \
            "Download **$ASSET** and upload that file to Play exactly as it arrives — do not extract or re-zip it." \
            "" \
            "If the downloaded file is not exactly $BYTES bytes, the transfer was cut short. Delete it and download again.")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "Play bundle $VN ($VC)" --notes "$NOTES" --latest=false
          fi
          echo "::notice::Direct download: $(gh release view "$TAG" --json url -q .url)"

      - uses: actions/upload-artifact@v4
        with:
          name: lockinpoint-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
