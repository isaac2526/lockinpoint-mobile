# =============================================================================
# THE BUILD · a real Android App Bundle (AAB).
#
# This is where the AAB actually comes from: a GitHub runner has the Android
# SDK, so it can compile what a plain checkout cannot. Runs on a pull request
# into main, or whenever you press "Run workflow" — never on an ordinary push,
# because compiling Android is the slow part.
#
# The artifact it uploads is the file you submit to Google Play.
# =============================================================================
name: build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify version code from pubspec.yaml
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//')
          CODE="${VERSION##*+}"
          if [ "$CODE" -le 21 ]; then
            echo "::error::versionCode must be greater than 21, got $CODE from pubspec.yaml ($VERSION)"
            exit 1
          fi
          echo "::notice::Building AAB with pubspec version $VERSION (versionCode $CODE)."

      - name: Build release AAB
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: lockinpoint-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

      - name: Say where it is
        run: |
          echo "### AAB ready" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**lockinpoint-aab** (app-release.aab) is in the Artifacts section of this run." >> "$GITHUB_STEP_SUMMARY"
