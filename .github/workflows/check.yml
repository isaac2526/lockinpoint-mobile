# =============================================================================
# THE FAST CHECK · runs on every push.
#
# Format, analyse, test. No Android SDK, no Gradle, no APK — so it finishes in
# a few minutes instead of half an hour. A typo fix must never cost you a
# thirty minute wait, which is the whole reason this is separate from build.yml.
# =============================================================================
name: check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A second push cancels the first: no point analysing a commit already replaced.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - run: flutter pub get

      # Formatting is checked, not applied, so a diff never lands by surprise.
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  # ===========================================================================
  # THE OFFLINE VAULT, ON A REAL DEVICE, WITH THE NETWORK REALLY GONE.
  #
  # The unit tests above use an in-memory database and an Api that throws.
  # That proves the repository's logic and nothing else. This runs the REAL
  # app binary on the Linux desktop against a REAL HTTP server, then KILLS
  # that server mid-run — which is how the vault's promise is actually kept
  # or broken. It already caught one bug a mock could never have seen: on a
  # minimal Linux image the vault could not open at all.
  #
  # Separate job because it needs the desktop toolchain, and a typo fix must
  # not wait for GTK to install.
  # ===========================================================================
  offline-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
                                  libgtk-3-dev liblzma-dev libsecret-1-dev \
                                  libjsoncpp-dev xvfb

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - run: flutter pub get

      # A display, because the integration test runs the real windowed app.
      - name: Prove the vault works with no network
        run: xvfb-run -a ./scripts/offline-vault-check.sh linux
