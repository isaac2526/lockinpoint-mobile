# =============================================================================
# RELEASE ARTIFACTS · run by hand from the Actions tab.
#
# android-bundle · the .aab Google Play ingests. Until a Play upload keystore
#   is created and stored as repository secrets, the bundle is signed with the
#   debug key: fine for inspection, refused by the Play Console. Creating the
#   real key is a one time step done together deliberately, because losing it
#   or changing it strands every installed copy.
#
# ios-unsigned · Runner.app zipped into an .ipa with no code signature.
#   Enough to inspect and to sideload through tools that re-sign; distributing
#   through TestFlight or the App Store requires an Apple Developer account,
#   which is a paid, human step no workflow can conjure.
#
# web · the one artifact that needs no platform SDK at all, so it is also the
#   one this project can verify anywhere.
#
# windows / macos-desktop / linux · one Flutter codebase, six targets. Each
#   must be built ON its own operating system: a Windows .exe cannot be
#   produced on Linux, a .dmg cannot be produced anywhere but macOS. That is
#   a property of the toolchains, not a gap in this file, and it is exactly
#   why these jobs exist here rather than being run by hand.
#
# NONE OF THE DESKTOP ARTIFACTS ARE CODE SIGNED. Windows will show
# SmartScreen's "unrecognised app" warning and macOS will refuse to open the
# app until it is right-clicked once, or Gatekeeper is told otherwise. Signing
# needs a paid certificate from Microsoft and an Apple Developer ID — human,
# paid steps that no workflow can conjure. Better to say so than to ship an
# artifact that quietly frightens the first person who opens it.
# =============================================================================
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get

      # ---------------------------------------------------------------------
      # THE UPLOAD KEY, IF THERE IS ONE.
      #
      # Four repository secrets turn this on. Without them the build still
      # runs and is signed with the debug key — useful for inspection, and
      # REFUSED by the Play Console, which the summary step says out loud so
      # nobody discovers it at upload time.
      #
      #   ANDROID_KEYSTORE_BASE64   base64 of your upload-keystore.jks
      #   ANDROID_KEYSTORE_PASSWORD the store password
      #   ANDROID_KEY_ALIAS         the alias inside the store (e.g. upload)
      #   ANDROID_KEY_PASSWORD      that alias's password
      # ---------------------------------------------------------------------
      - name: Write the upload key
        # The secrets context is not available to a step `if:`, so the secret
        # is bound to an env var and THAT is tested. A missing secret is an
        # empty string, never an error.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Refusing to build a debug-signed bundle: Google Play rejects one, and a runner's debug key is regenerated per run, so even an accepted upload could never be updated. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD, or run the play-aab workflow which does only this."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          # The file is git-ignored and lives only on this runner.
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

          # ---------------------------------------------------------------
          # OPEN THE KEYSTORE BEFORE GRADLE DOES.
          #
          # A wrong password, a wrong alias or a mangled base64 all surface
          # from Gradle as an opaque "exit code 1" several minutes into a
          # build. keytool answers the same question in a second, and its
          # error names WHICH of the three is wrong. No secret is echoed:
          # keytool's messages never contain the password.
          # ---------------------------------------------------------------
          KS="$RUNNER_TEMP/upload-keystore.jks"

          # Is it a keystore at all? This separates "the base64 lost bytes"
          # from "the password is wrong" WITHOUT needing keytool's prose —
          # and without printing anything derived from a secret. A JKS starts
          # with the magic FEEDFEED; a PKCS12 is DER, starting 30 82.
          SIZE=$(stat -c%s "$KS")
          MAGIC=$(head -c 4 "$KS" | od -An -tx1 | tr -d ' \n')
          echo "decoded keystore: $SIZE bytes, magic $MAGIC"
          case "$MAGIC" in
            feedfeed*) echo "format: JKS" ;;
            3082*)     echo "format: PKCS12" ;;
            *)
              echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a keystore ($SIZE bytes, magic $MAGIC). Re-run: base64 -w0 your.jks | gh secret set ANDROID_KEYSTORE_BASE64 (macOS: base64 -i your.jks)."
              exit 1 ;;
          esac

          # keytool writes some failures to stdout and some to stderr, so
          # BOTH are captured. The first version sent stdout to /dev/null and
          # reported an empty reason, which is its own small lesson.
          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" > ks.out 2>&1; then
            echo "::error::The keystore did not open with ANDROID_KEYSTORE_PASSWORD. keytool: $(tr '\n' ' ' < ks.out | head -c 400)"
            exit 1
          fi
          echo "The store password is correct."

          if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > alias.out 2>&1; then
            echo "::error::The store opened but ANDROID_KEY_ALIAS was not found in it. keytool: $(tr '\n' ' ' < alias.out | head -c 300)"
            echo "::error::Aliases actually present: $(grep -oE '^[^,]+, [A-Za-z]{3} [0-9]{1,2}, [0-9]{4}' ks.out | cut -d, -f1 | tr '\n' ' ')"
            exit 1
          fi
          echo "The alias exists and the store password opens it."


      # A build failure here used to reach me as "Process completed with exit
      # code 1" and nothing else, because this environment cannot download
      # Actions logs. The diagnostic lines are lifted into an ANNOTATION,
      # which the API does serve — a failure nobody can read is a failure
      # nobody can fix.
      - name: Build app bundle
        run: |
          set -o pipefail
          if ! flutter build appbundle --release 2>&1 | tee bundle.log; then
            echo "::group::the last of the build log"
            tail -80 bundle.log
            echo "::endgroup::"
            DIAG=$(grep -iE "keystore|password|alias|signing|FAILURE:|Caused by|error:|Execution failed" bundle.log \
                   | tail -25 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::flutter build appbundle failed.%0A$DIAG"
            exit 1
          fi

      - name: Build release APK
        run: flutter build apk --release

      # ---------------------------------------------------------------------
      # INTERROGATE THE FINISHED BUNDLE.
      #
      # Everything below is read back OUT of the .aab. What the build was told
      # (pubspec.yaml, build.gradle.kts) is not evidence of what it produced —
      # that distinction is the whole reason a debug-signed bundle was once
      # handed over as a release.
      # ---------------------------------------------------------------------
      - name: Prove the bundle is release-signed and fit for Play
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB" || { echo "::error::no bundle was produced"; exit 1; }

          # --- the signer, from the bundle -------------------------------
          keytool -printcert -jarfile "$AAB" > signer.txt
          if grep -q "CN=Android Debug" signer.txt; then
            echo "::error::debug-signed bundle — Google Play will refuse it"
            cat signer.txt
            exit 1
          fi

          # --- the manifest, from the bundle, with Google's own tool ------
          BT=1.17.2
          curl -sSL -o bundletool.jar \
            "https://github.com/google/bundletool/releases/download/$BT/bundletool-all-$BT.jar"
          PKG=$(java -jar bundletool.jar dump manifest --bundle="$AAB" --xpath=/manifest/@package)
          VC=$(java -jar bundletool.jar dump manifest --bundle="$AAB" --xpath=/manifest/@android:versionCode)
          VN=$(java -jar bundletool.jar dump manifest --bundle="$AAB" --xpath=/manifest/@android:versionName)

          # The package name can never change once Play has seen it.
          if [ "$PKG" != "com.lockinpoint.app" ]; then
            echo "::error::package is $PKG, expected com.lockinpoint.app"
            exit 1
          fi

          {
            echo "### The Play bundle"
            echo ""
            echo "| Read from the .aab | Value |"
            echo "|---|---|"
            echo "| package | \`$PKG\` |"
            echo "| versionName | \`$VN\` |"
            echo "| versionCode | \`$VC\` |"
            echo "| size | \`$(du -h "$AAB" | cut -f1)\` |"
            echo ""
            echo '```'
            grep -E "Owner:|Issuer:|Valid from:|SHA256:" signer.txt | head -5
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          grep -E "Owner:|SHA256:" signer.txt | head -2
          echo "::notice::Release-signed $PKG $VN ($VC) — fit to upload to Google Play."

      - uses: actions/upload-artifact@v4
        with:
          # Named for what it is: the verified, release-signed Play bundle.
          name: lockinpoint-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lockinpoint-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

  ios-unsigned:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign
      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qry lockinpoint-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: lockinpoint-unsigned-ipa
          path: lockinpoint-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build web
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: lockinpoint-web
          path: build/web
          retention-days: 30
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      # The zip is the artifact that is guaranteed: it contains lockinpoint.exe
      # and every DLL beside it, which is what a Windows app actually is.
      - name: Zip the build
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
                           -DestinationPath lockinpoint-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lockinpoint-windows
          path: lockinpoint-windows.zip
          retention-days: 30
          if-no-files-found: error

  macos-desktop:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      # hdiutil ships with macOS, so the .dmg needs no extra tooling. It is
      # UNSIGNED and UNNOTARISED: the first person to open it must right-click
      # and choose Open once. Notarising needs a paid Developer ID.
      - name: Make the disk image
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "No .app was produced"; exit 1; }
          mkdir -p dmg-staging
          cp -R "$APP" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname LockInPoint -srcfolder dmg-staging \
                         -ov -format UDZO lockinpoint-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: lockinpoint-macos-dmg
          path: lockinpoint-macos.dmg
          retention-days: 30
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # GTK for the shell, libsecret for flutter_secure_storage, ninja and
      # cmake for the build itself. Without libsecret the build fails at link
      # time, not at runtime, which is a confusing way to learn this.
      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
                                  libgtk-3-dev liblzma-dev libstdc++-12-dev \
                                  libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Tar the bundle
        run: tar -czf lockinpoint-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      # A .deb on top, because "download a tarball and find the binary" is not
      # how anyone installs software on Ubuntu. Built with dpkg-deb, which is
      # already on the runner — no packaging action, nothing to trust.
      - name: Build the .deb
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          ROOT=deb/lockinpoint
          mkdir -p "$ROOT/DEBIAN" "$ROOT/opt/lockinpoint" "$ROOT/usr/share/applications" "$ROOT/usr/bin"
          cp -r build/linux/x64/release/bundle/* "$ROOT/opt/lockinpoint/"
          ln -s /opt/lockinpoint/lockinpoint "$ROOT/usr/bin/lockinpoint"
          # A DEBIAN control file cannot carry stray leading whitespace, and
          # every line inside a YAML block scalar necessarily has some. So the
          # heredoc is piped through sed, which strips exactly this file's own
          # indentation and leaves the ONE space that Description's
          # continuation lines are required to keep.
          sed 's/^          //' > "$ROOT/DEBIAN/control" <<EOF
          Package: lockinpoint
          Version: $V
          Section: education
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libsecret-1-0
          Maintainer: LockInPoint <info@lockinpoint.com>
          Description: LockInPoint exam preparation
           Past questions, CBT mocks and an AI tutor for JAMB, WAEC, NECO,
           NABTEB, Post UTME and GCE.
          EOF
          # The icon is copied in explicitly rather than pointed at inside
          # flutter_assets, because the app does not declare an assets: block
          # and nothing under assets/ is bundled. A .desktop entry aimed at a
          # path that is not there shows a blank tile in the launcher.
          install -Dm644 assets/icon/icon.png \
                  "$ROOT/usr/share/icons/hicolor/512x512/apps/lockinpoint.png"
          sed 's/^          //' > "$ROOT/usr/share/applications/lockinpoint.desktop" <<EOF
          [Desktop Entry]
          Name=LockInPoint
          Comment=Past questions, CBT mocks and an AI tutor
          Exec=/opt/lockinpoint/lockinpoint
          Icon=lockinpoint
          Terminal=false
          Type=Application
          Categories=Education;
          EOF
          dpkg-deb --build --root-owner-group "$ROOT" "lockinpoint_${V}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: lockinpoint-linux
          path: |
            lockinpoint-linux-x64.tar.gz
            lockinpoint_*_amd64.deb
          retention-days: 30
          if-no-files-found: error
