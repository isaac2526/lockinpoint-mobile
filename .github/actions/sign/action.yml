# =============================================================================
# THE RELEASE SIGNING KEY, MADE AVAILABLE TO A BUILD.
#
# Every job that produces an Android artifact needs the same twelve lines, so
# they live here once. A composite action, not a reusable workflow, because it
# has to run inside an existing job's checkout.
#
# THE KEYSTORE LIVES IN THE REPO, ENCRYPTED — AES-256, PBKDF2 at 300k
# iterations. The alternative is a base64 secret, and that means asking a
# person to paste six thousand characters without a single one going missing.
# On a phone that is not a reasonable thing to ask; a value that arrives
# truncated fails at exactly the step meant to guarantee the signature. What
# has to be pasted here is one 40-character passphrase and one password. The
# encrypted file is useless without them, which is why it is safe in the repo.
# =============================================================================
name: Release signing key
description: Decrypt the release keystore and write android/key.properties.

inputs:
  passphrase:
    description: ANDROID_KEYSTORE_PASSPHRASE — decrypts the .enc file.
    required: false
    default: ""
  password:
    description: ANDROID_KEYSTORE_PASSWORD — opens the keystore itself.
    required: false
    default: ""

outputs:
  signed:
    description: "true when the real key is in place; false when the build will fall back to debug."
    value: ${{ steps.key.outputs.signed }}

runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        KEYSTORE_PASSPHRASE: ${{ inputs.passphrase }}
        KEYSTORE_PASSWORD: ${{ inputs.password }}
      run: |
        ENC=android-signing/lip-release.jks.enc
        if [ -z "$KEYSTORE_PASSPHRASE" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
          echo "signed=false" >> $GITHUB_OUTPUT
          {
            echo "### UNSIGNED-FOR-RELEASE BUILD"
            echo ""
            echo "\`ANDROID_KEYSTORE_PASSPHRASE\` / \`ANDROID_KEYSTORE_PASSWORD\` are not"
            echo "both set, so this build carries a throwaway debug key. It installs,"
            echo "but a student must UNINSTALL to move to the next build, and Google"
            echo "Play will refuse it."
          } >> $GITHUB_STEP_SUMMARY
          exit 0
        fi
        test -f "$ENC" || { echo "::error::$ENC is missing from the repo."; exit 1; }

        KEYSTORE="$PWD/android/lip-release.jks"
        # Whitespace is trimmed: a paste that picks up a trailing newline is
        # the single most likely way this fails, and it is not worth a build.
        PHRASE=$(printf '%s' "$KEYSTORE_PASSPHRASE" | tr -d '[:space:]')
        PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
        echo "passphrase received: ${#PHRASE} characters (expected 40)"

        openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 \
          -in "$ENC" -out "$KEYSTORE" -pass "pass:$PHRASE" 2>/dev/null || {
          echo "::error::Could not decrypt the keystore. ANDROID_KEYSTORE_PASSPHRASE"
          echo "::error::is wrong, or was cut short when pasted. It must be exactly"
          echo "::error::40 characters; this run received ${#PHRASE}."
          exit 1
        }
        keytool -list -keystore "$KEYSTORE" -storepass "$PASSWORD" > /dev/null || {
          echo "::error::The keystore decrypted, but ANDROID_KEYSTORE_PASSWORD does"
          echo "::error::not open it. It received ${#PASSWORD} characters. A trailing"
          echo "::error::space, or a missing last character, is the usual cause."
          exit 1
        }
        {
          echo "storePassword=$PASSWORD"
          echo "keyPassword=$PASSWORD"
          echo "keyAlias=lockinpoint"
          echo "storeFile=$KEYSTORE"
        } > android/key.properties
        echo "signed=true" >> $GITHUB_OUTPUT
        echo "release key in place — $(keytool -list -keystore "$KEYSTORE" -storepass "$PASSWORD" | grep -i 'SHA-256' | head -1)"
